name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint + composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer
          coverage: none

      - name: php -l on every PHP file
        run: |
          set -e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.log 2>&1 || { grep -v '^No syntax errors' /tmp/lint.log; exit 1; }
          echo "Linted $(grep -c '^No syntax errors' /tmp/lint.log) files"

      - name: composer validate
        run: composer validate --strict

  smoke:
    name: Smoke test (MariaDB + php -S)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: techzone_db
          MARIADB_USER: tz
          MARIADB_PASSWORD: tz
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://tz:tz@127.0.0.1:3306/techzone_db
      APP_DEBUG: '0'
      BASE: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Apply schema and seed
        run: |
          mariadb -h127.0.0.1 -P3306 -utz -ptz techzone_db < database/schema.sql
          mariadb -h127.0.0.1 -P3306 -utz -ptz techzone_db < database/seed.sql
          mariadb -h127.0.0.1 -P3306 -utz -ptz techzone_db -e "SELECT COUNT(*) AS products FROM products"

      - name: Concurrent checkout (12 buyers, 3 units)
        run: php tests/concurrent_checkout.php

      - name: Start PHP built-in server
        run: |
          php -d display_errors=0 -d log_errors=1 -d error_log=/tmp/php-errors.log \
              -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null "$BASE/" && break; sleep 1; done

      - name: Smoke checks
        run: |
          set -euo pipefail
          fail=0
          expect() { # expect <status> <path> [curl args...]
            local want="$1" path="$2"; shift 2
            local got
            got=$(curl -s -o /tmp/body -w '%{http_code}' "$@" "$BASE$path")
            if [ "$got" = "$want" ]; then echo "ok   $got $path"; else echo "FAIL $got (want $want) $path"; head -c 400 /tmp/body; echo; fail=1; fi
          }
          expect 302 /
          expect 200 /MarketingSite/index.php
          expect 200 /MarketingSite/shop/products.php
          expect 200 "/MarketingSite/shop/product-details.php?id=1"
          expect 200 /AdminPortal/index.php
          expect 200 /MarketingSite/api/check_session.php
          expect 401 /AdminPortal/api/customers.php
          expect 404 /MarketingSite/tools/verify-assets.php
          grep -q '"logged_in":false' <(curl -s "$BASE/MarketingSite/api/check_session.php") || { echo "FAIL check_session body"; fail=1; }

          # Admin login -> JSON API (200, no password hashes) -> CSRF rejection
          jar=$(mktemp)
          curl -s -c "$jar" -b "$jar" -H "Origin: $BASE" -d 'username=admin@techzone.pk' -d 'password=Admin@1234' \
               "$BASE/AdminPortal/api/login.php" | tee /tmp/login.json; echo
          grep -q '"success":true' /tmp/login.json || { echo "FAIL admin login"; fail=1; }
          expect 200 "/AdminPortal/api/customers.php?limit=5" -b "$jar"
          if grep -q '"password"' /tmp/body; then echo "FAIL customers API leaks password field"; fail=1; fi
          expect 200 /AdminPortal/api/dashboard_stats.php -b "$jar"
          expect 403 /AdminPortal/api/orders.php -b "$jar" -X PUT -H 'Origin: https://evil.example' \
                 -H 'Content-Type: application/json' -d '{"id":1,"status":"Cancelled"}'

          # Customer login uses the same generic error for unknown emails
          curl -s -H "Origin: $BASE" -d 'email=nobody@example.com' -d 'password=x' "$BASE/MarketingSite/api/login.php" \
            | grep -q 'Invalid email or password' || { echo "FAIL generic login error"; fail=1; }

          if [ -s /tmp/php-errors.log ]; then echo "--- PHP error log"; cat /tmp/php-errors.log; fi
          exit $fail

      - name: Server log on failure
        if: failure()
        run: cat /tmp/php-server.log /tmp/php-errors.log 2>/dev/null || true
